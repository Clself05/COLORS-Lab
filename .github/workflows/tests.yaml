name: Run Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: colorsdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v3

      - name: Install PHP
        run: sudo apt-get install php php-mysqli

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Create Colors table
        run: |
          sudo apt-get install mysql-client
          mysql -h 127.0.0.1 -u root -proot colorsdb <<EOF
          CREATE TABLE Colors (
            ID INT AUTO_INCREMENT PRIMARY KEY,
            UserId VARCHAR(255),
            Name VARCHAR(255)
          );
          EOF

      - name: Start PHP server
        working-directory: ${{ github.workspace }}
        run: php -S localhost:8000 -t api &

      - name: Debug working directory
        run: |
          echo "Current directory:"
          pwd
          echo "Contents:"
          ls -R .
      
      - name: Run tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: root
          DB_NAME: colorsdb
        run: npm test